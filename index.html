<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>
    <style>
        input[type="datetime-local"] { color-scheme: dark; background: #1e293b; color: white; }
        .calendar-dot { width: 4px; height: 4px; background-color: #60a5fa; border-radius: 50%; margin: 0 auto; margin-top: 2px; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-200 overflow-x-hidden font-sans text-right">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); 
            const [students, setStudents] = useState([]);
            const [allTransactions, setAllTransactions] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            
            const [newStudent, setNewStudent] = useState({ name: '', idNum: '', dob: '', address: '', phone: '' });
            const [lessonForm, setLessonForm] = useState({ dateTime: '', price: '200' });

            useEffect(() => {
                if (window.db && isAuthenticated) loadData();
            }, [isAuthenticated]);

            const loadData = async () => {
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const jumpToStudentHistory = (lesson) => {
                const student = students.find(s => s.id === lesson.studentId);
                if (student) { setSelectedStudent(student); setView('student-history'); }
            };

            const handleEditLesson = async (lesson) => {
                const action = prompt("עריכת שיעור: 1-שינוי תאריך/שעה, 2-ביטול שיעור", "1");
                if (action === "1") {
                    const newTime = prompt("הזן תאריך ושעה (YYYY-MM-DD HH:MM)", lesson.date.slice(0,16).replace('T', ' '));
                    if (newTime) {
                        const iso = new Date(newTime.replace(' ', 'T')).toISOString();
                        await window.fs.updateDoc(window.fs.doc(window.db, "transactions", lesson.id), { 
                            date: iso, status: new Date(iso) > new Date() ? 'upcoming' : 'completed'
                        });
                        loadData();
                    }
                } else if (action === "2") {
                    const reason = prompt("מהי סיבת הביטול?");
                    if (reason !== null) {
                        await window.fs.updateDoc(window.fs.doc(window.db, "transactions", lesson.id), { 
                            status: 'cancelled', cancelReason: reason || "בוטל"
                        });
                        loadData();
                    }
                }
            };

            const downloadPDF = () => {
                const doc = new jspdf.jsPDF();
                const filtered = allTransactions.filter(t => t.studentId === selectedStudent.id);
                doc.text("DrivePro Student Statement", 10, 10);
                doc.text(`Student: ${selectedStudent.name}`, 10, 20);
                doc.text(`Balance: NIS ${selectedStudent.balance}`, 10, 30);
                const rows = filtered.map(t => [new Date(t.date).toLocaleDateString(), t.type === 'lesson' ? 'Lesson' : 'Payment', t.amount]);
                doc.autoTable({ head: [['Date', 'Type', 'Amount']], body: rows, startY: 40 });
                doc.save(`${selectedStudent.name}_ledger.pdf`);
            };

            const sendWhatsApp = () => {
                const phone = selectedStudent.phone ? selectedStudent.phone.replace(/\D/g, '') : '';
                const finalPhone = phone.startsWith('0') ? '972' + phone.substring(1) : phone;
                const msg = `*DrivePro Summary for ${selectedStudent.name}*%0A*Current Balance: ₪${selectedStudent.balance}*%0ALessons: ${selectedStudent.lessons}`;
                window.open(`https://wa.me/${finalPhone}?text=${msg}`, '_blank');
            };

            const handleDeleteStudent = async (id) => {
                if(!confirm("מחיקת תלמיד?")) return;
                await window.fs.deleteDoc(window.fs.doc(window.db, "students", id));
                setView('main'); loadData();
            };

            const updateStudentField = async (field, label) => {
                const val = prompt(`עדכן ${label}:`, selectedStudent[field] || "");
                if (val === null) return;
                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), { [field]: val });
                setSelectedStudent({...selectedStudent, [field]: val}); loadData();
            };

            const handleAddStudent = async () => {
                if(!newStudent.name) return alert("שם חובה");
                await window.fs.addDoc(window.fs.collection(window.db, "students"), { ...newStudent, balance: 0, lessons: 0 });
                setNewStudent({ name: '', idNum: '', dob: '', address: '', phone: '' });
                setView('main'); loadData();
            };

            const handleConfirmLesson = async () => {
                const { dateTime, price } = lessonForm;
                if(!dateTime) return;
                const isoDate = new Date(dateTime).toISOString();
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id, studentName: selectedStudent.name, type: 'lesson', amount: Number(price), date: isoDate, status: new Date(isoDate) > new Date() ? 'upcoming' : 'completed'
                });
                if(new Date(isoDate) <= new Date()) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)), lessons: window.fs.increment(1)
                    });
                }
                setView('student-details'); loadData();
            };

            const handleAddPayment = async (studentId) => {
                const amount = prompt("סכום תשלום?");
                const method = prompt("1-מזומן, 2-אשראי, 3-ביט, 4-העברה, 5-שיק", "3");
                if(!amount) return;
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId, type: 'payment', amount: Number(amount), date: new Date().toISOString(), method: method || "מזומן"
                });
                await window.fs.updateDoc(window.fs.doc(window.db, "students", studentId), { balance: window.fs.increment(-Number(amount)) });
                loadData();
            };

            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-white p-6 text-center">
                    <h1 className="text-4xl font-black mb-8 text-indigo-500 italic uppercase">Drive Pro</h1>
                    <input type="password" placeholder="קוד גישה" className="bg-slate-900 border-2 border-indigo-500 text-white text-center text-4xl p-4 rounded-3xl w-full max-w-xs outline-none"
                           onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            // --- VIEW: LEDGER OPTIONS ---
            if (view === 'ledger-options' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto min-h-screen flex flex-col justify-center text-center">
                    <button onClick={() => setView('select-ledger-student')} className="mb-10 text-blue-400 font-bold self-start">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl mb-10">
                        <h2 className="text-3xl font-black mb-2">{selectedStudent.name}</h2>
                        <div className="text-emerald-500 font-bold text-xl mb-8">יתרה: ₪{selectedStudent.balance}</div>
                        <div className="space-y-4">
                            <button onClick={() => setView('ledger-view')} className="w-full bg-slate-800 text-white p-5 rounded-3xl font-black border border-slate-700">📂 צפה בכרטסת</button>
                            <button onClick={downloadPDF} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black">📥 הורד כרטסת (PDF)</button>
                            <button onClick={sendWhatsApp} className="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black">💬 שלח כרטסת (WhatsApp)</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'ledger-view' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('ledger-options')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <h2 className="text-2xl font-black mb-6 italic">{selectedStudent.name} - כרטסת</h2>
                    <div className="space-y-3">
                        {allTransactions.filter(t => t.studentId === selectedStudent.id).map(t => (
                            <div key={t.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                <div className="text-right">
                                    <div className="font-bold text-slate-100">{t.type === 'lesson' ? '📖 שיעור' : '💰 תשלום'}</div>
                                    <div className="text-slate-500">{new Date(t.date).toLocaleDateString('he-IL')}</div>
                                </div>
                                <div className={`font-black text-sm ${t.type === 'lesson' ? 'text-red-400' : 'text-emerald-400'}`}>{t.type === 'lesson' ? `+₪${t.amount}` : `-₪${t.amount}`}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'select-ledger-student' || view === 'student-list') return (
                <div className="p-6 max-w-md mx-auto text-right">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <input autoFocus className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none mb-6 text-right" placeholder="🔍 חפש תלמיד..." onChange={e => setSearchTerm(e.target.value)} />
                    <div className="space-y-3">
                        {students.filter(s => s.name.includes(searchTerm)).map(s => (
                            <div key={s.id} onClick={() => { setSelectedStudent(s); setView(view === 'select-ledger-student' ? 'ledger-options' : 'student-details'); }} className="bg-slate-900 p-5 rounded-[2rem] border border-slate-800 flex justify-between items-center active:scale-95 transition-all shadow-md">
                                <span className="font-bold">{s.name}</span>
                                <span className={s.balance > 0 ? 'text-red-500' : 'text-emerald-500'}>₪{s.balance}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- שאר המסכים (ללא שינוי מהגרסה העובדת) ---
            if (view === 'student-history' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('student-details')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <h2 className="text-2xl font-black mb-6 italic text-slate-100">שיעורים: {selectedStudent.name}</h2>
                    <div className="space-y-4">
                        {allTransactions.filter(t => t.studentId === selectedStudent.id && t.type === 'lesson').map(l => (
                            <div key={l.id} className={`bg-slate-900 p-5 rounded-2xl border-r-8 flex justify-between items-center ${l.status === 'completed' ? 'border-emerald-500' : l.status === 'cancelled' ? 'border-red-500' : 'border-slate-500'}`}>
                                <div className="text-right flex-1">
                                    <div className={`font-black ${l.status === 'completed' ? 'text-emerald-400' : l.status === 'cancelled' ? 'text-red-400' : 'text-slate-400'}`}>שיעור נהיגה</div>
                                    <div className="text-[10px] text-slate-500">{new Date(l.date).toLocaleString('he-IL')}</div>
                                    {l.cancelReason && <div className="text-[10px] text-red-500 italic">סיבה: {l.cancelReason}</div>}
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    <div className="font-black text-slate-200">₪{l.amount}</div>
                                    <button onClick={() => handleEditLesson(l)} className="text-[10px] bg-blue-900/50 text-blue-400 px-3 py-1 rounded-full border border-blue-800 font-bold">ערוך</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'student-details' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl mb-8 text-right">
                        <h2 className="text-3xl font-black text-white mb-6 italic">{selectedStudent.name}</h2>
                        <div className="space-y-3 text-slate-400 text-xs mb-8">
                            <p>📞 טלפון: <span className="text-slate-200">{selectedStudent.phone || '---'}</span></p>
                            <p>🆔 ת"ז: <span className="text-slate-200">{selectedStudent.idNum || '---'}</span></p>
                        </div>
                        <div className="flex justify-between border-t border-slate-800 pt-6">
                            <div onClick={() => { setSelectedStudent(selectedStudent); setView('ledger-options'); }} className="text-center flex-1 border-l border-slate-800 cursor-pointer">
                                <p className="text-[10px] text-slate-500 font-bold mb-1 underline">חוב</p>
                                <p className={`text-2xl font-black ${selectedStudent.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>₪{selectedStudent.balance}</p>
                            </div>
                            <div onClick={() => setView('student-history')} className="text-center flex-1 cursor-pointer">
                                <p className="text-[10px] text-blue-500 font-black mb-1 underline">שיעורים ➔</p>
                                <p className="text-2xl font-black text-slate-100">{selectedStudent.lessons}</p>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => { setLessonForm({dateTime: new Date().toISOString().slice(0,16), price: '200'}); setView('add-lesson'); }} className="flex-1 bg-blue-600 text-white py-4 rounded-[1.8rem] font-black">+ שיעור</button>
                        <button onClick={() => handleAddPayment(selectedStudent.id)} className="flex-1 bg-emerald-600 text-white py-4 rounded-[1.8rem] font-black">₪ תשלום</button>
                    </div>
                </div>
            );

            if (view === 'add-student') return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right">
                    <button onClick={() => setView('main')} className="mb-8 text-blue-400 font-bold">← ביטול</button>
                    <div className="space-y-4">
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none" placeholder="שם מלא *" value={newStudent.name} onChange={e=>setNewStudent({...newStudent, name: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" type="date" value={newStudent.dob} onChange={e=>setNewStudent({...newStudent, dob: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" placeholder="טלפון" type="tel" value={newStudent.phone} onChange={e=>setNewStudent({...newStudent, phone: e.target.value})} />
                        <button className="w-full bg-blue-600 text-white p-5 rounded-[1.8rem] font-black" onClick={handleAddStudent}>שמירת תלמיד</button>
                    </div>
                </div>
            );

            if (view === 'add-lesson') return (
                <div className="p-6 max-w-md mx-auto text-center">
                    <button onClick={() => setView('student-details')} className="mb-8 text-blue-400 font-bold self-start block">← ביטול</button>
                    <div className="space-y-6 bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
                        <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center font-bold" type="datetime-local" value={lessonForm.dateTime} onChange={e=>setLessonForm({...lessonForm, dateTime: e.target.value})} />
                        <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center text-xl font-black text-emerald-400" type="number" value={lessonForm.price} onChange={e=>setLessonForm({...lessonForm, price: e.target.value})} />
                        <button className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black" onClick={handleConfirmLesson}>אשר שיעור</button>
                    </div>
                </div>
            );

            return (
                <div className="p-4 max-w-md mx-auto pb-32 text-right">
                    <header className="flex justify-between items-center mb-8 pt-6 px-4 italic">
                        <h1 className="text-3xl font-black text-slate-100 tracking-tighter italic uppercase">Drive<span className="text-blue-500">Pro</span></h1>
                        <div onClick={() => { setSelectedStudent(null); setView('ledger-view'); }} className="text-[10px] font-black text-slate-500 bg-slate-900 px-4 py-2 rounded-full border border-slate-800 cursor-pointer shadow-lg shadow-blue-900/10">
                             חוב כולל: <span className="text-emerald-500">₪{students.reduce((a,b)=>a+(b.balance||0),0)}</span>
                        </div>
                    </header>

                    <h2 className="text-xl font-black text-slate-100 mb-4 px-2 italic text-right font-bold tracking-tighter">יומן עבודה</h2>
                    <div className="bg-slate-900 p-5 rounded-[2.5rem] mb-8 border border-slate-800 shadow-2xl">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))}>◀</button>
                            <h3 className="font-black italic text-xs uppercase text-slate-100">{new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' }).format(currentMonth)}</h3>
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))}>▶</button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-600 mb-2 italic"><div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div></div>
                        <div className="grid grid-cols-7 gap-1 mb-6">
                            {(() => {
                                const days = [];
                                const first = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
                                const count = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
                                const todayStr = new Date().toISOString().split('T')[0];
                                for (let i = 0; i < first; i++) days.push(<div key={`e-${i}`} className="h-10"></div>);
                                for (let d = 1; d <= count; d++) {
                                    const ds = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                    const has = allTransactions.some(t => t.type === 'lesson' && t.date.startsWith(ds));
                                    days.push(<div key={d} onClick={() => setSelectedDate(ds)} className={`h-10 flex flex-col items-center justify-center rounded-xl text-xs cursor-pointer active:scale-90 ${ds === todayStr ? 'ring-2 ring-yellow-500' : ''} ${selectedDate === ds ? 'bg-blue-600 text-white font-black' : 'text-slate-300'}`}>{d}{has && <div className="calendar-dot"></div>}</div>);
                                }
                                return days;
                            })()}
                        </div>
                        <div className="space-y-2 border-t border-slate-800 pt-4">
                            {allTransactions.filter(t => t.type === 'lesson' && t.date.startsWith(selectedDate)).map(l => (
                                <div key={l.id} onClick={() => jumpToStudentHistory(l)} className={`text-xs flex justify-between p-3 rounded-2xl border border-slate-700/30 active:scale-95 ${l.status === 'cancelled' ? 'bg-red-900/30' : 'bg-slate-800/50'}`}>
                                    <div className="text-right">
                                        <div className={`font-bold ${l.status === 'cancelled' ? 'text-red-400' : 'text-slate-200'}`}>{l.studentName}</div>
                                        {l.status === 'cancelled' && <div className="text-[8px] text-red-500">מבוטל: {l.cancelReason}</div>}
                                    </div>
                                    <span className="font-black text-blue-400">{new Date(l.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 px-2">
                        <button onClick={() => setView('add-student')} className="bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex flex-col items-center gap-2 active:scale-95 uppercase"><span className="text-2xl text-blue-500">+</span> <span className="text-[10px]">הוספת תלמיד</span></button>
                        <button onClick={() => { setSearchTerm(''); setView('student-list'); }} className="bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex flex-col items-center gap-2 active:scale-95 uppercase"><span className="text-2xl text-indigo-500">👥</span> <span className="text-[10px]">רשימת תלמידים</span></button>
                        <button onClick={() => { setSearchTerm(''); setView('select-ledger-student'); }} className="col-span-2 bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex items-center justify-center gap-4 active:scale-95 uppercase text-xs italic"><span className="text-2xl">📋</span> כרטסת תלמיד</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
