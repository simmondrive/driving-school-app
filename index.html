                if (window.db && isAuthenticated) loadData();

            const loadData = async () => {
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const jumpToStudentHistory = (lesson) => {
                const student = students.find(s => s.id === lesson.studentId);
                if (student) { setSelectedStudent(student); setView('student-history'); }
            };

            const handleSaveStudent = async () => {
                if(!studentForm.name) return alert("שם חובה");
                if(isEditing) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), studentForm);
                } else {
                    await window.fs.addDoc(window.fs.collection(window.db, "students"), { ...studentForm, balance: 0, lessons: 0 });
                }
                setStudentForm({ name: '', idNum: '', dob: '', address: '', phone: '', school: '', greenForm: 'לא', theory: 'לא' });
                setIsEditing(false); setView('main'); loadData();
            };

            const openEditStudent = (student) => {
                setSelectedStudent(student);
                setStudentForm({ ...student });
                setIsEditing(true); setView('add-student');
            };

                const doc = new jspdf.jsPDF();
                const filtered = allTransactions.filter(t => t.studentId === selectedStudent.id);
                doc.setFontSize(20);
                doc.text("DRIVEPRO STATEMENT", 10, 20);
                doc.setFontSize(12);
                doc.text(`Student: ${selectedStudent.name}`, 10, 30);
                doc.text(`Balance: NIS ${selectedStudent.balance}`, 10, 38);
                const rows = filtered.map(t => [new Date(t.date).toLocaleDateString(), t.type === 'lesson' ? 'Driving Lesson' : 'Payment', t.amount]);
                doc.autoTable({ head: [['Date', 'Description', 'Amount']], body: rows, startY: 45 });
                doc.save(`${selectedStudent.name}_ledger.pdf`);
            };

            const sendWhatsAppLedger = () => {
                const phone = selectedStudent.phone ? selectedStudent.phone.replace(/\D/g, '') : '';
                const finalPhone = phone.startsWith('0') ? '972' + phone.substring(1) : phone;
                const msg = `*DrivePro Summary: ${selectedStudent.name}*%0A*Balance: ₪${selectedStudent.balance}*%0ALessons: ${selectedStudent.lessons}`;
                window.open(`https://wa.me/${finalPhone}?text=${msg}`, '_blank');
            };

                const { dateTime, price } = lessonForm;
                if(!dateTime) return;
                const isoDate = new Date(dateTime).toISOString();
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id, studentName: selectedStudent.name, type: 'lesson', amount: Number(price), date: isoDate, status: new Date(isoDate) > new Date() ? 'upcoming' : 'completed'
                });
                if(new Date(isoDate) <= new Date()) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)), lessons: window.fs.increment(1)
                    });
                }
                setView('student-details'); loadData();
            };

                const amount = prompt("סכום תשלום?");
                const method = prompt("1-מזומן, 2-אשראי, 3-ביט, 4-העברה", "3");
                if(!amount) return;
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId, type: 'payment', amount: Number(amount), date: new Date().toISOString(), method: method || "מזומן"
                });
                await window.fs.updateDoc(window.fs.doc(window.db, "students", studentId), { balance: window.fs.increment(-Number(amount)) });
                loadData();
            };
