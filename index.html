<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ספריית PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>
    <style>
        input[type="datetime-local"] { color-scheme: dark; background: #1e293b; color: white; }
        .calendar-dot { width: 4px; height: 4px; background-color: #60a5fa; border-radius: 50%; margin: 0 auto; margin-top: 2px; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-200 overflow-x-hidden font-sans text-right">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); // main, add-student, student-details, add-lesson, manage-lesson, student-list, ledger, ledger-options, select-ledger-student
            const [students, setStudents] = useState([]);
            const [allTransactions, setAllTransactions] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [selectedLesson, setSelectedLesson] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            
            const [newStudent, setNewStudent] = useState({ name: '', idNum: '', dob: '', address: '', phone: '' });
            const [lessonForm, setLessonForm] = useState({ dateTime: '', price: '200' });

            useEffect(() => {
                if (window.db && isAuthenticated) loadData();
            }, [isAuthenticated]);

            const loadData = async () => {
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const handleManageLesson = (lesson) => {
                const student = students.find(s => s.id === lesson.studentId);
                setSelectedStudent(student);
                setSelectedLesson(lesson);
                setLessonForm({ dateTime: lesson.date.slice(0, 16), price: String(lesson.amount) });
                setView('manage-lesson');
            };

            const updateLessonTime = async () => {
                if(!lessonForm.dateTime) return;
                const newDate = new Date(lessonForm.dateTime).toISOString();
                await window.fs.updateDoc(window.fs.doc(window.db, "transactions", selectedLesson.id), {
                    date: newDate,
                    status: new Date(newDate) > new Date() ? 'upcoming' : 'completed'
                });
                alert("השיעור עודכן בהצלחה");
                setView('main');
                loadData();
            };

            const cancelLessonAction = async () => {
                if(!confirm("האם אתה בטוח שברצונך לבטל את השיעור?")) return;
                
                if(confirm("האם תרצה לקבוע שיעור זה לתאריך אחר?")) {
                    const newDateTime = prompt("הזן תאריך ושעה חדשים (YYYY-MM-DD HH:MM)", "");
                    if(newDateTime) {
                        const isoDate = new Date(newDateTime.replace(' ', 'T')).toISOString();
                        await window.fs.updateDoc(window.fs.doc(window.db, "transactions", selectedLesson.id), {
                            date: isoDate,
                            status: new Date(isoDate) > new Date() ? 'upcoming' : 'completed',
                            cancelReason: ''
                        });
                    }
                } else {
                    const reason = prompt("מהי סיבת הביטול?", "");
                    await window.fs.updateDoc(window.fs.doc(window.db, "transactions", selectedLesson.id), {
                        status: 'cancelled',
                        cancelReason: reason || "בוטל על ידי המורה"
                    });
                }
                setView('main');
                loadData();
            };

            const exportLedgerPDF = (isDownload = true) => {
                const doc = new jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                const filtered = allTransactions.filter(t => t.studentId === selectedStudent.id);
                doc.text(`Ledger: ${selectedStudent.name}`, 10, 10);
                const rows = filtered.map(t => [new Date(t.date).toLocaleDateString('he-IL'), t.type, t.amount]);
                doc.autoTable({ head: [['Date', 'Type', 'Amount']], body: rows, startY: 30 });
                if (isDownload) doc.save(`${selectedStudent.name}.pdf`);
                else window.open(doc.output('bloburl'), '_blank');
            };

            const sendLedgerWA = () => {
                const phone = selectedStudent.phone ? selectedStudent.phone.replace(/\D/g, '') : '';
                const msg = `שלום ${selectedStudent.name}, יתרה ב-DrivePro: ₪${selectedStudent.balance}`;
                window.open(`https://wa.me/${phone.startsWith('0') ? '972' + phone.substring(1) : phone}?text=${msg}`, '_blank');
            };

            const handleDeleteStudent = async (id) => {
                if(!confirm("מחיקת תלמיד?")) return;
                await window.fs.deleteDoc(window.fs.doc(window.db, "students", id));
                setView('main'); loadData();
            };

            const updateStudentField = async (field, label) => {
                const val = prompt(`עדכן ${label}:`, selectedStudent[field] || "");
                if (val === null) return;
                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), { [field]: val });
                setSelectedStudent({...selectedStudent, [field]: val}); loadData();
            };

            const handleAddStudent = async () => {
                if(!newStudent.name) return alert("שם חובה");
                await window.fs.addDoc(window.fs.collection(window.db, "students"), { ...newStudent, balance: 0, lessons: 0 });
                setNewStudent({ name: '', idNum: '', dob: '', address: '', phone: '' });
                setView('main'); loadData();
            };

            const handleConfirmLesson = async () => {
                const { dateTime, price } = lessonForm;
                if(!dateTime) return;
                const isoDate = new Date(dateTime).toISOString();
                const isUpcoming = new Date(dateTime) > new Date();
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id, studentName: selectedStudent.name, type: 'lesson', amount: Number(price), date: isoDate, status: isUpcoming ? 'upcoming' : 'completed'
                });
                if(!isUpcoming) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)), lessons: window.fs.increment(1)
                    });
                }
                setView('main'); loadData();
            };

            const handleAddPayment = async (studentId) => {
                const amount = prompt("סכום תשלום?");
                const method = prompt("1-מזומן, 2-אשראי, 3-ביט, 4-העברה, 5-שיק", "3");
                const methods = {"1":"מזומן", "2":"אשראי", "3":"ביט", "4":"העברה", "5":"שיק"};
                if(!amount) return;
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId, type: 'payment', amount: Number(amount), date: new Date().toISOString(), method: methods[method] || "מזומן"
                });
                await window.fs.updateDoc(window.fs.doc(window.db, "students", studentId), { balance: window.fs.increment(-Number(amount)) });
                loadData();
            };

            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-white p-6">
                    <h1 className="text-4xl font-black mb-8 text-indigo-500 italic uppercase">Drive Pro</h1>
                    <input type="password" placeholder="קוד גישה" className="bg-slate-900 border-2 border-indigo-500 text-white text-center text-4xl p-4 rounded-3xl w-full max-w-xs outline-none"
                           onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            // --- VIEW: MANAGE LESSON ---
            if (view === 'manage-lesson' && selectedLesson) return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-center">
                    <button onClick={() => setView('main')} className="mb-8 text-blue-400 font-bold self-start block">← ביטול</button>
                    <h2 className="text-2xl font-black mb-2 text-white italic">ניהול שיעור: {selectedLesson.studentName}</h2>
                    <div className="space-y-6 bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl mt-10">
                        <div>
                            <label className="block text-xs text-slate-500 mb-2 uppercase font-bold">ערוך זמן שיעור</label>
                            <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center font-bold" type="datetime-local" value={lessonForm.dateTime} onChange={e=>setLessonForm({...lessonForm, dateTime: e.target.value})} />
                        </div>
                        <button onClick={updateLessonTime} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black">שמור שינויים</button>
                        <div className="border-t border-slate-800 pt-6">
                            <button onClick={cancelLessonAction} className="w-full bg-red-900/40 text-red-400 p-4 rounded-2xl font-bold border border-red-900/50">ביטול שיעור</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'ledger-options' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto min-h-screen flex flex-col justify-center text-center">
                    <button onClick={() => setView('select-ledger-student')} className="mb-10 text-blue-400 font-bold self-start">← חזרה</button>
                    <h2 className="text-3xl font-black mb-10">{selectedStudent.name}</h2>
                    <div className="space-y-4">
                        <button onClick={sendLedgerWA} className="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black shadow-lg">שלח כרטסת (WhatsApp)</button>
                        <button onClick={() => exportLedgerPDF(true)} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black shadow-lg">הורד כרטסת (PDF)</button>
                        <button onClick={() => { setView('ledger'); }} className="w-full bg-slate-800 text-white p-5 rounded-3xl font-black border border-slate-700 shadow-lg">הצג כרטסת</button>
                    </div>
                </div>
            );

            if (view === 'select-ledger-student' || view === 'student-list') return (
                <div className="p-6 max-w-md mx-auto text-right">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <input autoFocus className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none mb-6 text-right" placeholder="🔍 חפש תלמיד..." onChange={e => setSearchTerm(e.target.value)} />
                    <div className="space-y-3">
                        {students.filter(s => s.name.includes(searchTerm)).map(s => (
                            <div key={s.id} onClick={() => { setSelectedStudent(s); setView(view === 'select-ledger-student' ? 'ledger-options' : 'student-details'); }} className="bg-slate-900 p-5 rounded-[2rem] border border-slate-800 flex justify-between items-center shadow-md active:scale-95 transition-all">
                                <span className="font-bold">{s.name}</span>
                                <span className={s.balance > 0 ? 'text-red-500' : 'text-emerald-500'}>₪{s.balance}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'ledger') return (
                <div className="p-6 max-w-md mx-auto text-right">
                    <button onClick={() => setView(selectedStudent ? 'ledger-options' : 'main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <h2 className="text-2xl font-black mb-6 italic">{selectedStudent?.name || 'פירוט כללי'}</h2>
                    <div className="space-y-3 text-right">
                        {allTransactions.filter(t => !selectedStudent || t.studentId === selectedStudent.id).map(t => (
                            <div key={t.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                <div>
                                    <div className="font-bold text-slate-100 text-right">{t.type === 'lesson' ? '📖 שיעור' : `💰 תשלום (${t.method})`}</div>
                                    <div className="text-slate-500 text-right">{new Date(t.date).toLocaleDateString('he-IL')}</div>
                                </div>
                                <div className={`font-black text-sm ${t.type === 'lesson' ? 'text-red-400' : 'text-emerald-400'}`}>
                                    {t.type === 'lesson' ? `+₪${t.amount}` : `-₪${t.amount}`}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'add-student') return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right">
                    <button onClick={() => setView('main')} className="mb-8 text-blue-400 font-bold">← ביטול</button>
                    <h2 className="text-3xl font-black mb-8 text-white italic">תלמיד חדש</h2>
                    <div className="space-y-4 text-right">
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" placeholder="שם מלא *" value={newStudent.name} onChange={e=>setNewStudent({...newStudent, name: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" placeholder="תעודת זהות" value={newStudent.idNum} onChange={e=>setNewStudent({...newStudent, idNum: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" type="date" value={newStudent.dob} onChange={e=>setNewStudent({...newStudent, dob: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" placeholder="כתובת" value={newStudent.address} onChange={e=>setNewStudent({...newStudent, address: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-right" placeholder="טלפון" type="tel" value={newStudent.phone} onChange={e=>setNewStudent({...newStudent, phone: e.target.value})} />
                        <button className="w-full bg-blue-600 text-white p-5 rounded-[1.8rem] font-black" onClick={handleAddStudent}>שמירת תלמיד</button>
                    </div>
                </div>
            );

            if (view === 'student-details' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto text-right">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl mb-8">
                        <h2 className="text-3xl font-black text-white mb-6 italic">{selectedStudent.name}</h2>
                        <div className="space-y-3 text-slate-400 text-xs mb-8 text-right">
                            <p onClick={() => updateStudentField('idNum', 'ת"ז')}>🆔 ת"ז: <span className="text-slate-200">{selectedStudent.idNum || 'הוסף'}</span></p>
                            <p onClick={() => updateStudentField('dob', 'לידה')}>📅 לידה: <span className="text-slate-200">{selectedStudent.dob || 'הוסף'}</span></p>
                            <p onClick={() => updateStudentField('address', 'כתובת')}>🏠 כתובת: <span className="text-slate-200">{selectedStudent.address || 'הוסף'}</span></p>
                            <p onClick={() => updateStudentField('phone', 'טלפון')}>📞 טלפון: <span className="text-slate-200">{selectedStudent.phone || 'הוסף'}</span></p>
                        </div>
                        <div className="flex justify-between border-t border-slate-800 pt-6">
                            <div onClick={() => setView('ledger')} className="text-center flex-1 border-l border-slate-800 cursor-pointer">
                                <p className="text-[10px] text-slate-500 font-bold mb-1 underline">חוב (פירוט)</p>
                                <p className={`text-2xl font-black ${selectedStudent.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>₪{selectedStudent.balance}</p>
                            </div>
                            <div className="text-center flex-1">
                                <p className="text-[10px] text-slate-500 font-bold mb-1">שיעורים</p>
                                <p className="text-2xl font-black text-slate-100">{selectedStudent.lessons}</p>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-4 mb-10 text-right">
                        <button onClick={() => { setLessonForm({dateTime: new Date().toISOString().slice(0,16), price: '200'}); setView('add-lesson'); }} className="flex-1 bg-blue-600 text-white py-4 rounded-[1.8rem] font-black">+ שיעור</button>
                        <button onClick={() => handleAddPayment(selectedStudent.id)} className="flex-1 bg-emerald-600 text-white py-4 rounded-[1.8rem] font-black">₪ תשלום</button>
                    </div>
                    <button onClick={() => handleDeleteStudent(selectedStudent.id)} className="w-full text-red-900 text-[10px] font-bold uppercase tracking-widest opacity-50">מחיקת תלמיד</button>
                </div>
            );

            if (view === 'add-lesson') return (
                <div className="p-6 max-w-md mx-auto text-center">
                    <button onClick={() => setView('student-details')} className="mb-8 text-blue-400 font-bold self-start block">← ביטול</button>
                    <h2 className="text-3xl font-black mb-10 text-white italic">קביעת שיעור</h2>
                    <div className="space-y-6 bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800">
                        <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center font-bold" type="datetime-local" value={lessonForm.dateTime} onChange={e=>setLessonForm({...lessonForm, dateTime: e.target.value})} />
                        <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center text-xl font-black text-emerald-400" type="number" value={lessonForm.price} onChange={e=>setLessonForm({...lessonForm, price: e.target.value})} />
                        <button className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black shadow-xl" onClick={handleConfirmLesson}>אשר שיעור</button>
                    </div>
                </div>
            );

            return (
                <div className="p-4 max-w-md mx-auto pb-32 text-right">
                    <header className="flex justify-between items-center mb-8 pt-6 px-4 italic">
                        <h1 className="text-3xl font-black text-slate-100 tracking-tighter italic uppercase">Drive<span className="text-blue-500">Pro</span></h1>
                        <div onClick={() => { setSelectedStudent(null); setView('ledger'); }} className="text-[10px] font-black text-slate-500 bg-slate-900 px-4 py-2 rounded-full border border-slate-800 cursor-pointer shadow-lg shadow-blue-900/10">
                             חוב כולל: <span className="text-emerald-500 underline">₪{students.reduce((a,b)=>a+(b.balance||0),0)}</span>
                        </div>
                    </header>

                    {/* יומן עבודה */}
                    <h2 className="text-xl font-black text-slate-100 mb-4 px-2 italic text-right">יומן עבודה</h2>
                    <div className="bg-slate-900 p-5 rounded-[2.5rem] mb-8 border border-slate-800 shadow-2xl">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))}>◀</button>
                            <h3 className="font-black italic text-xs uppercase text-slate-100">{new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' }).format(currentMonth)}</h3>
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))}>▶</button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-600 mb-2 italic">
                            <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div>
                        </div>
                        <div className="grid grid-cols-7 gap-1 mb-6">
                            {(() => {
                                const days = [];
                                const first = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
                                const count = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
                                const todayStr = new Date().toISOString().split('T')[0];
                                for (let i = 0; i < first; i++) days.push(<div key={`e-${i}`} className="h-10"></div>);
                                for (let d = 1; d <= count; d++) {
                                    const ds = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                    const has = allTransactions.some(t => t.type === 'lesson' && t.date.startsWith(ds));
                                    const isToday = ds === todayStr;
                                    days.push(<div key={d} onClick={() => setSelectedDate(ds)} className={`h-10 flex flex-col items-center justify-center rounded-xl text-xs cursor-pointer transition-all active:scale-90 ${isToday ? 'ring-2 ring-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.5)]' : ''} ${selectedDate === ds ? 'bg-blue-600 text-white font-black' : 'text-slate-300'}`}>{d}{has && <div className="calendar-dot"></div>}</div>);
                                }
                                return days;
                            })()}
                        </div>
                        <div className="space-y-2 border-t border-slate-800 pt-4">
                            {allTransactions.filter(t => t.type === 'lesson' && t.date.startsWith(selectedDate)).map(l => (
                                <div key={l.id} 
                                     onClick={() => handleManageLesson(l)}
                                     className={`text-xs flex justify-between p-3 rounded-2xl border border-slate-700/30 active:scale-95 transition-all ${l.status === 'cancelled' ? 'bg-red-900/30 border-red-900/50' : 'bg-slate-800/50'}`}>
                                    <div className="flex flex-col text-right">
                                        <span className={`font-bold ${l.status === 'cancelled' ? 'text-red-400' : 'text-slate-200'}`}>{l.studentName}</span>
                                        {l.status === 'cancelled' && <span className="text-[9px] italic text-red-500">בוטל: {l.cancelReason}</span>}
                                    </div>
                                    <span className={`font-black ${l.status === 'cancelled' ? 'text-red-400' : 'text-blue-400'}`}>{new Date(l.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 gap-4 px-2">
                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={() => setView('add-student')} className="bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex flex-col items-center gap-2 active:scale-95 transition-all">
                                <span className="text-2xl text-blue-500">+</span> <span className="text-[10px] uppercase">הוספת תלמיד</span>
                            </button>
                            <button onClick={() => { setSearchTerm(''); setView('student-list'); }} className="bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex flex-col items-center gap-2 active:scale-95 transition-all">
                                <span className="text-2xl text-indigo-500">👥</span> <span className="text-[10px] uppercase tracking-tighter">רשימת תלמידים</span>
                            </button>
                        </div>
                        <button onClick={() => { setSearchTerm(''); setView('select-ledger-student'); }} className="w-full bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex items-center justify-center gap-4 active:scale-95 transition-all uppercase tracking-widest text-xs italic">
                            <span className="text-2xl">📋</span> כרטסת תלמיד
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
