<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>

        input[type="datetime-local"], input[type="date"] { color-scheme: dark; background: #1e293b; color: white; border: 1px solid #334155; }

</head>
<body className="bg-slate-950 text-slate-200 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); 
            const [students, setStudents] = useState([]);
            const [allTransactions, setAllTransactions] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [isEditing, setIsEditing] = useState(false);
            
            // המשתנה היחיד לטופס
            const [formData, setFormData] = useState({ 
                name: '', idNum: '', dob: '', address: '', phone: '',
                school: '', greenForm: 'לא', theory: 'לא' 
            });
            const [lessonForm, setLessonForm] = useState({ dateTime: '', price: '200' });

            useEffect(() => {
                if (window.db && isAuthenticated) loadData();
            }, [isAuthenticated]);

            const loadData = async () => {
                try {
                    const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                    const snapS = await window.fs.getDocs(qS);
                    setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                    
                    const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                    const snapL = await window.fs.getDocs(qL);
                    setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
                } catch(e) { console.log(e); }
            };

            const handleSave = async () => {
                if(!formData.name) return alert("שם חובה");
                try {
                    if (isEditing && selectedStudent) {
                        await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), formData);
                    } else {
                        await window.fs.addDoc(window.fs.collection(window.db, "students"), { ...formData, balance: 0, lessons: 0 });
                    }
                    setFormData({ name: '', idNum: '', dob: '', address: '', phone: '', school: '', greenForm: 'לא', theory: 'לא' });
                    setIsEditing(false);
                    setView('main');
                    loadData();
                } catch(e) { alert("שגיאה"); }
            };

            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-6">
                    <h1 className="text-4xl font-black mb-8 text-indigo-500 italic uppercase">Drive Pro</h1>
                    <input type="password" placeholder="קוד גישה" className="bg-slate-900 border-2 border-indigo-500 text-white text-center text-4xl p-4 rounded-3xl w-full max-w-xs outline-none"
                           onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            if (view === 'add-student') return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right">
                    <button onClick={() => {setView('main'); setIsEditing(false);}} className="mb-6 text-blue-400 font-bold">← ביטול</button>
                    <h2 className="text-3xl font-black mb-6 text-white italic">{isEditing ? 'עדכון תלמיד' : 'תלמיד חדש'}</h2>
                    <div className="space-y-4 pb-10">
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl text-white" placeholder="שם מלא *" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} />
                        <label className="block text-[10px] text-slate-500 mr-2 font-bold uppercase">תאריך לידה</label>
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl text-white" type="date" value={formData.dob} onChange={e=>setFormData({...formData, dob: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl text-white" placeholder="טלפון" type="tel" value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl text-white" placeholder="תעודת זהות" value={formData.idNum} onChange={e=>setFormData({...formData, idNum: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl text-white" placeholder="כתובת" value={formData.address} onChange={e=>setFormData({...formData, address: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl text-white" placeholder="בית ספר" value={formData.school} onChange={e=>setFormData({...formData, school: e.target.value})} />
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                <p className="text-[10px] text-slate-500 font-bold mb-2 uppercase">טופס ירוק</p>
                                <div className="flex gap-2">
                                    <button onClick={()=>setFormData({...formData, greenForm:'כן'})} className={`flex-1 py-2 rounded-xl font-bold ${formData.greenForm === 'כן' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>כן</button>
                                    <button onClick={()=>setFormData({...formData, greenForm:'לא'})} className={`flex-1 py-2 rounded-xl font-bold ${formData.greenForm === 'לא' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>לא</button>
                                </div>
                            </div>
                            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                                <p className="text-[10px] text-slate-500 font-bold mb-2 uppercase">תיאוריה</p>
                                <div className="flex gap-2">
                                    <button onClick={()=>setFormData({...formData, theory:'כן'})} className={`flex-1 py-2 rounded-xl font-bold ${formData.theory === 'כן' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>כן</button>
                                    <button onClick={()=>setFormData({...formData, theory:'לא'})} className={`flex-1 py-2 rounded-xl font-bold ${formData.theory === 'לא' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>לא</button>
                                </div>
                            </div>
                        </div>
                        <button className="w-full bg-indigo-600 text-white p-5 rounded-3xl font-black shadow-xl mt-4" onClick={handleSave}>אישור ושמירה</button>
                    </div>
                </div>
            );

            if (view === 'student-list') return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl mb-6 text-white text-right" placeholder="🔍 חפש תלמיד..." onChange={e => setSearchTerm(e.target.value)} />
                    <div className="space-y-3">
                        {students.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase())).map(s => (
                            <div key={s.id} className="bg-slate-900 p-5 rounded-[2rem] border border-slate-800 flex justify-between items-center">
                                <div className="flex-1" onClick={() => { setSelectedStudent(s); setView('student-details'); }}>
                                    <span className="font-bold text-lg text-white">{s.name}</span>
                                    <span className={`mr-3 text-sm ${s.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>₪{s.balance}</span>
                                </div>
                                <button onClick={() => { setSelectedStudent(s); setFormData({...s}); setIsEditing(true); setView('add-student'); }} className="bg-slate-800 p-2 rounded-xl text-indigo-400">📝</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- תצוגות כרטסת (עובד, לא נגעתי) ---
            if (view === 'ledger-options' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto min-h-screen flex flex-col justify-center text-center">
                    <button onClick={() => setView('main')} className="mb-10 text-blue-400 font-bold self-start">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
                        <h2 className="text-3xl font-black mb-2">{selectedStudent.name}</h2>
                        <div className="text-emerald-500 font-bold text-xl mb-8">₪{selectedStudent.balance}</div>
                        <div className="space-y-4">
                            <button onClick={() => setView('ledger-view')} className="w-full bg-slate-800 text-white p-5 rounded-3xl font-bold">📂 הצג כרטסת</button>
                            <button onClick={() => { 
                                const doc = new jspdf.jsPDF(); 
                                doc.text(`DrivePro - ${selectedStudent.name}`, 10, 10); 
                                doc.save(`${selectedStudent.name}.pdf`); 
                            }} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-bold">📥 הורד PDF</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'student-details' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl mb-8">
                        <h2 className="text-3xl font-black text-white mb-6 italic">{selectedStudent.name}</h2>
                        <div className="space-y-3 text-slate-400 text-xs mb-8">
                            <p>📞 טלפון: <span className="text-slate-200">{selectedStudent.phone || '---'}</span></p>
                            <p>🏫 בית ספר: <span className="text-slate-200">{selectedStudent.school || '---'}</span></p>
                            <p>📋 ירוק/תיאוריה: <span className="text-slate-200">{selectedStuden
