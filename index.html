<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro Elite v4.0</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc, getDoc };
    </script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SECRET_PIN = "1234";

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); // 'main', 'details', 'schedule'
            const [students, setStudents] = useState([]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (isAuthenticated) loadStudents();
            }, [isAuthenticated]);

            const loadStudents = async () => {
                const q = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snap = await window.fs.getDocs(q);
                setStudents(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const loadStudentData = async (student) => {
                setLoading(true);
                const q = window.fs.query(window.fs.collection(window.db, "transactions"), 
                    window.fs.where("studentId", "==", student.id), window.fs.orderBy("date", "desc"));
                const snap = await window.fs.getDocs(q);
                setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                setSelectedStudent(student);
                setView('details');
                setLoading(false);
            };

            const handleAddStudent = async () => {
                const name = prompt("שם מלא:");
                const phone = prompt("טלפון:");
                const idNum = prompt("מספר ת"ז:");
                const address = prompt("כתובת:");
                if(!name) return;
                await window.fs.addDoc(window.fs.collection(window.db, "students"), {
                    name, phone, idNum, address, balance: 0, actualLessons: 0, 
                    internalTest: 'טרם', externalTest: 'טרם'
                });
                loadStudents();
            };

            const handleAddLesson = async () => {
                const dateStr = prompt("תאריך ושעה (פורמט: YYYY-MM-DDTHH:MM)", new Date().toISOString().slice(0,16));
                const duration = prompt("משך המפגש בדקות? (60 דקות = 1.5 שיעורים)", "60");
                const price = prompt("מחיר המפגש?", "200");
                if(!dateStr || !price) return;

                const lessonsCount = (Number(duration) / 60) * 1.5;
                const isFuture = new Date(dateStr) > new Date();

                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id,
                    type: 'lesson',
                    date: dateStr,
                    amount: Number(price),
                    lessonsCount: lessonsCount,
                    status: isFuture ? 'upcoming' : 'completed'
                });

                if(!isFuture) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)),
                        actualLessons: window.fs.increment(lessonsCount)
                    });
                }
                loadStudentData(selectedStudent);
            };

            const handleAddPayment = async () => {
                const amount = prompt("סכום תשלום:");
                if(!amount) return;
                const method = prompt("אמצעי תשלום (1-מזומן, 2-ביט, 3-העברה, 4-צ'ק, 5-אשראי):", "2");
                const methods = { "1": "מזומן", "2": "ביט", "3": "העברה", "4": "צ'ק", "5": "אשראי" };
                
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id,
                    type: 'payment',
                    date: new Date().toISOString(),
                    amount: Number(amount),
                    method: methods[method] || "ביט"
                });

                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                    balance: window.fs.increment(-Number(amount))
                });
                loadStudentData(selectedStudent);
            };

            const updateTestStatus = async (type, status) => {
                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), { [type]: status });
                setSelectedStudent({...selectedStudent, [type]: status});
            };

            // --- UI Components ---
            if (!isAuthenticated) return (
                <div class="flex flex-col items-center justify-center h-screen p-6">
                    <h1 class="text-4xl font-black mb-8 text-indigo-400">DRIVE PRO</h1>
                    <input type="password" placeholder="קוד גישה" 
                        class="bg-slate-800 border-2 border-indigo-500 text-white text-center text-2xl p-4 rounded-2xl w-64 outline-none"
                        onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            if (view === 'details' && selectedStudent) return (
                <div class="p-4 max-w-2xl mx-auto pb-24">
                    <button onClick={() => {setView('main'); loadStudents();}} class="mb-6 text-indigo-400 font-bold">← חזרה לרשימה</button>
                    
                    <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 mb-6">
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-3xl font-black">{selectedStudent.name}</h2>
                            <div class="text-2xl font-black text-rose-500">₪{selectedStudent.balance}</div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-sm text-slate-400">
                            <div>📞 {selectedStudent.phone}</div>
                            <div>🆔 {selectedStudent.idNum}</div>
                            <div>🏠 {selectedStudent.address}</div>
                            <div class="text-indigo-400 font-bold">🏁 שיעורים: {selectedStudent.actualLessons.toFixed(1)}</div>
                        </div>
                        
                        <div class="flex gap-2 mt-6">
                            <button onClick={handleAddLesson} class="flex-1 bg-indigo-600 p-3 rounded-xl font-bold">+ קביעת שיעור</button>
                            <button onClick={handleAddPayment} class="flex-1 bg-emerald-600 p-3 rounded-xl font-bold">₪ הזנת תשלום</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                            <div class="text-xs mb-2">טסט פנימי</div>
                            <select class="bg-slate-700 rounded p-1 w-full" value={selectedStudent.internalTest} onChange={(e)=>updateTestStatus('internalTest', e.target.value)}>
                                <option>טרם</option><option>עבר</option><option>נכשל</option>
                            </select>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                            <div class="text-xs mb-2">טסט חיצוני</div>
                            <select class="bg-slate-700 rounded p-1 w-full" value={selectedStudent.externalTest} onChange={(e)=>updateTestStatus('externalTest', e.target.value)}>
                                <option>טרם</option><option>עבר</option><option>נכשל</option>
                            </select>
                        </div>
                    </div>

                    <h3 class="font-bold mb-4">היסטוריית פעולות</h3>
                    <div class="space-y-3">
                        {transactions.map(t => (
                            <div key={t.id} class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex justify-between">
                                <div>
                                    <div class="font-bold">{t.type === 'lesson' ? '📖 שיעור נהיגה' : `💰 תשלום (${t.method})`}</div>
                                    <div class="text-xs text-slate-500">{new Date(t.date).toLocaleString('he-IL')}</div>
                                </div>
                                <div class="text-right">
                                    <div class={t.type === 'lesson' ? 'text-rose-400' : 'text-emerald-400'}>
                                        {t.type === 'lesson' ? `+₪${t.amount}` : `-₪${t.amount}`}
                                    </div>
                                    {t.status === 'upcoming' && <div class="text-[10px] bg-indigo-900 text-indigo-300 px-2 rounded-full mt-1">עתידי</div>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div class="p-4 max-w-2xl mx-auto">
                    <div class="flex justify-between items-center mb-8 pt-4">
                        <h1 class="text-3xl font-black italic">DRIVE<span class="text-indigo-500">PRO</span></h1>
                        <button onClick={handleAddStudent} class="bg-indigo-600 w-12 h-12 rounded-full text-2xl font-bold shadow-lg shadow-indigo-500/20">+</button>
                    </div>

                    <div class="grid gap-4">
                        {students.map(s => (
                            <div key={s.id} onClick={() => loadStudentData(s)} 
                                class="bg-slate-800 p-5 rounded-[2rem] border border-slate-700 flex justify-between items-center active:scale-95 transition-transform shadow-lg">
                                <div>
                                    <div class="text-xl font-bold">{s.name}</div>
                                    <div class="text-sm text-slate-500 italic">שיעורים: {s.actualLessons?.toFixed(1) || 0}</div>
                                </div>
                                <div class={`text-2xl font-black ${s.balance > 0 ? 'text-rose-500' : 'text-emerald-500'}`}>₪{s.balance}</div>
                            </div>
                        ))}
                    </div>

                    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-indigo-600 px-8 py-3 rounded-full font-bold shadow-2xl">
                        סה"כ חוב תלמידים: ₪{students.reduce((a,b)=>a+b.balance, 0)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
