<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ספריות PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>
    <style>
        input[type="datetime-local"], input[type="date"] { color-scheme: dark; background: #1e293b; color: white; }
        .calendar-dot { width: 4px; height: 4px; background-color: #60a5fa; border-radius: 50%; margin: 0 auto; margin-top: 2px; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body className="bg-slate-950 min-h-screen text-slate-200 overflow-x-hidden font-sans text-right">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); 
            const [students, setStudents] = useState([]);
            const [allTransactions, setAllTransactions] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [isEditing, setIsEditing] = useState(false);
            
            // המשתנה המקורי שלך מורחב בשדות החדשים
            const [newStudent, setNewStudent] = useState({ 
                name: '', idNum: '', dob: '', address: '', phone: '',
                school: '', greenForm: 'לא', theory: 'לא' 
            });
            const [lessonForm, setLessonForm] = useState({ dateTime: '', price: '200' });

            useEffect(() => {
                if (window.db && isAuthenticated) loadData();
            }, [isAuthenticated]);

            const loadData = async () => {
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const jumpToStudentHistory = (lesson) => {
                const student = students.find(s => s.id === lesson.studentId);
                if (student) { setSelectedStudent(student); setView('student-history'); }
            };

            const handleSaveStudent = async () => {
                if(!newStudent.name) return alert("שם חובה");
                if (isEditing && selectedStudent) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), newStudent);
                } else {
                    await window.fs.addDoc(window.fs.collection(window.db, "students"), { ...newStudent, balance: 0, lessons: 0 });
                }
                setNewStudent({ name: '', idNum: '', dob: '', address: '', phone: '', school: '', greenForm: 'לא', theory: 'לא' });
                setIsEditing(false);
                setView('main'); loadData();
            };

            const openEditStudent = (student) => {
                setSelectedStudent(student);
                setNewStudent({ ...student });
                setIsEditing(true);
                setView('add-student');
            };

            const downloadLedger = () => {
                const doc = new jspdf.jsPDF();
                const filtered = allTransactions.filter(t => t.studentId === selectedStudent.id);
                doc.text(`Ledger: ${selectedStudent.name}`, 10, 10);
                const rows = filtered.map(t => [new Date(t.date).toLocaleDateString(), t.type, t.amount]);
                doc.autoTable({ head: [['Date', 'Type', 'Amount']], body: rows, startY: 20 });
                doc.save(`${selectedStudent.name}.pdf`);
            };

            const sendWhatsAppLedger = () => {
                const phone = selectedStudent.phone ? selectedStudent.phone.replace(/\D/g, '') : '';
                const finalPhone = phone.startsWith('0') ? '972' + phone.substring(1) : phone;
                window.open(`https://wa.me/${finalPhone}?text=Summary for ${selectedStudent.name}`, '_blank');
            };

            const handleConfirmLesson = async () => {
                const { dateTime, price } = lessonForm;
                if(!dateTime) return;
                const isoDate = new Date(dateTime).toISOString();
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id, studentName: selectedStudent.name, type: 'lesson', amount: Number(price), date: isoDate, status: new Date(isoDate) > new Date() ? 'upcoming' : 'completed'
                });
                if(new Date(isoDate) <= new Date()) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)), lessons: window.fs.increment(1)
                    });
                }
                setView('student-details'); loadData();
            };

            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-white p-6 text-center">
                    <h1 className="text-4xl font-black mb-8 text-indigo-500 italic uppercase">Drive Pro</h1>
                    <input type="password" placeholder="קוד גישה" className="bg-slate-900 border-2 border-indigo-500 text-white text-center text-4xl p-4 rounded-3xl w-full max-w-xs outline-none shadow-2xl shadow-indigo-500/20"
                           onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            if (view === 'ledger-options' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto min-h-screen flex flex-col justify-center text-center">
                    <button onClick={() => setView('main')} className="mb-10 text-blue-400 font-bold self-start">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
                        <h2 className="text-3xl font-black mb-2 text-white">{selectedStudent.name}</h2>
                        <div className="space-y-4 mt-8">
                            <button onClick={() => setView('ledger-view')} className="w-full bg-slate-800 text-white p-5 rounded-3xl font-bold border border-slate-700">📂 צפה בכרטסת</button>
                            <button onClick={downloadLedger} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-bold">📥 הורד PDF</button>
                            <button onClick={sendWhatsAppLedger} className="w-full bg-emerald-600 text-white p-5 rounded-3xl font-bold">💬 שלח בוואטסאפ</button>
                        </div>
                    </div>
                </div>
            );

            if (view === 'ledger-view' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('ledger-options')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <h2 className="text-2xl font-black mb-6 italic text-white">{selectedStudent.name}</h2>
                    <div className="space-y-3">
                        {allTransactions.filter(t => t.studentId === selectedStudent.id).map(t => (
                            <div key={t.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                <div className="text-right">
                                    <div className="font-bold text-slate-100">{t.type === 'lesson' ? '📖 שיעור' : '💰 תשלום'}</div>
                                    <div className="text-slate-500">{new Date(t.date).toLocaleDateString('he-IL')}</div>
                                </div>
                                <div className={`font-black text-sm ${t.type === 'lesson' ? 'text-red-400' : 'text-emerald-400'}`}>{t.type === 'lesson' ? `+₪${t.amount}` : `-₪${t.amount}`}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'student-list' || view === 'select-ledger-student') return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <input autoFocus className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none mb-6 text-right text-white" placeholder="🔍 חפש תלמיד..." onChange={e => setSearchTerm(e.target.value)} />
                    <div className="space-y-3">
                        {students.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase())).map(s => (
                            <div key={s.id} className="bg-slate-900 p-5 rounded-[2rem] border border-slate-800 flex justify-between items-center shadow-md">
                                <div className="flex-1" onClick={() => { setSelectedStudent(s); setView(view === 'select-ledger-student' ? 'ledger-options' : 'student-details'); }}>
                                    <span className="font-bold text-lg text-white">{s.name}</span>
                                    <span className={s.balance > 0 ? 'mr-3 text-red-500 text-sm' : 'mr-3 text-emerald-500 text-sm'}>₪{s.balance}</span>
                                </div>
                                <button onClick={() => openEditStudent(s)} className="bg-slate-800 p-2 rounded-xl text-indigo-400 border border-slate-700">📝</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'add-student') return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right pb-20">
                    <button onClick={() => {setView('main'); setIsEditing(false);}} className="mb-8 text-blue-400 font-bold">← ביטול</button>
                    <h2 className="text-3xl font-black mb-8 text-white italic">{isEditing ? 'עדכון פרטים' : 'תלמיד חדש'}</h2>
                    <div className="space-y-4">
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-white" placeholder="שם מלא *" value={newStudent.name} onChange={e=>setNewStudent({...newStudent, name: e.target.value})} />
                        <label className="block text-[10px] text-slate-500 mr-2 font-bold uppercase">תאריך לידה</label>
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-white" type="date" value={newStudent.dob} onChange={e=>setNewStudent({...newStudent, dob: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-white text-right" placeholder="טלפון" type="tel" value={newStudent.phone} onChange={e=>setNewStudent({...newStudent, phone: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-white" placeholder="תעודת זהות" value={newStudent.idNum} onChange={e=>setNewStudent({...newStudent, idNum: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-white" placeholder="כתובת" value={newStudent.address} onChange={e=>setNewStudent({...newStudent, address: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-white" placeholder="בית ספר" value={newStudent.school} onChange={e=>setNewStudent({...newStudent, school: e.target.value})} />
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-center">
                                <p className="text-[10px] text-slate-500 font-bold mb-2 uppercase">טופס ירוק</p>
                                <div className="flex gap-2">
                                    <button onClick={()=>setNewStudent({...newStudent, greenForm:'כן'})} className={`flex-1 py-2 rounded-xl font-bold ${newStudent.greenForm === 'כן' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>כן</button>
                                    <button onClick={()=>setNewStudent({...newStudent, greenForm:'לא'})} className={`flex-1 py-2 rounded-xl font-bold ${newStudent.greenForm === 'לא' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>לא</button>
                                </div>
                            </div>
                            <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-center">
                                <p className="text-[10px] text-slate-500 font-bold mb-2 uppercase">תיאוריה</p>
                                <div className="flex gap-2">
                                    <button onClick={()=>setNewStudent({...newStudent, theory:'כן'})} className={`flex-1 py-2 rounded-xl font-bold ${newStudent.theory === 'כן' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>כן</button>
                                    <button onClick={()=>setNewStudent({...newStudent, theory:'לא'})} className={`flex-1 py-2 rounded-xl font-bold ${newStudent.theory === 'לא' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>לא</button>
                                </div>
                            </div>
                        </div>
                        <button className="w-full bg-blue-600 text-white p-5 rounded-[1.8rem] font-black shadow-xl mt-6 active:scale-95 transition-all" onClick={handleSaveStudent}>אישור ושמירה</button>
                    </div>
                </div>
            );

            if (view === 'student-details' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto min-h-screen text-right">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <div className="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl mb-8 relative">
                        <button onClick={() => openEditStudent(selectedStudent)} className="absolute top-6 left-6 text-indigo-400 bg-slate-800 p-2 rounded-xl border border-slate-700">📝</button>
                        <h2 className="text-3xl font-black text-white mb-6 italic">{selectedStudent.name}</h2>
                        <div className="space-y-3 text-slate-400 text-xs mb-8">
                            <p>📞 טלפון: <span className="text-slate-200">{selectedStudent.phone || '---'}</span></p>
                            <p>🆔 ת"ז: <span className="text-slate-200">{selectedStudent.idNum || '---'}</span></p>
                            <p>🏫 בית ספר: <span className="text-slate-200">{selectedStudent.school || '---'}</span></p>
                            <p>📋 ירוק/תיאוריה: <span className="text-slate-200">{selectedStudent.greenForm} / {selectedStudent.theory}</span></p>
                        </div>
                        <div className="flex justify-between border-t border-slate-800 pt-6">
                            <div onClick={() => setView('ledger-options')} className="text-center flex-1 border-l border-slate-800 cursor-pointer"><p className="text-[10px] text-slate-500 font-bold mb-1 underline">חוב</p><p className={`text-2xl font-black ${selectedStudent.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>₪{selectedStudent.balance}</p></div>
                            <div onClick={() => alert('שיעורים בבניה')} className="text-center flex-1 cursor-pointer"><p className="text-[10px] text-blue-500 font-bold mb-1 underline uppercase">שיעורים ➔</p><p className="text-2xl font-black text-slate-100">{selectedStudent.lessons || 0}</p></div>
                        </div>
                    </div>
                    <div className="flex gap-4 mb-10"><button onClick={() => { setLessonForm({dateTime: new Date().toISOString().slice(0,16), price: '200'}); setView('add-lesson'); }} className="flex-1 bg-blue-600 text-white py-4 rounded-[1.8rem] font-black shadow-lg">+ שיעור</button><button onClick={() => { 
                        const amt = prompt("סכום?");
                        if(amt) {
                            window.fs.addDoc(window.fs.collection(window.db, "transactions"), { studentId: selectedStudent.id, type: 'payment', amount: Number(amt), date: new Date().toISOString() });
                            window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), { balance: window.fs.increment(-Number(amt)) });
                            loadData();
                        }
                    }} className="flex-1 bg-emerald-600 text-white py-4 rounded-[1.8rem] font-black shadow-lg">₪ תשלום</button></div>
                </div>
            );

            if (view === 'add-lesson') return (
                <div className="p-6 max-w-md mx-auto text-center min-h-screen">
                    <button onClick={() => setView('student-details')} className="mb-8 text-blue-400 font-bold self-start block">← ביטול</button>
                    <div className="space-y-6 bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
                        <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center font-bold text-white" type="datetime-local" value={lessonForm.dateTime} onChange={e=>setLessonForm({...lessonForm, dateTime: e.target.value})} />
                        <input className="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 outline-none text-center text-xl font-black text-emerald-400" type="number" value={lessonForm.price} onChange={e=>setLessonForm({...lessonForm, price: e.target.value})} />
                        <button className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black shadow-xl" onClick={handleConfirmLesson}>אשר שיעור</button>
                    </div>
                </div>
            );

            return (
                <div className="p-4 max-w-md mx-auto pb-32 text-right">
                    <header className="flex justify-between items-center mb-8 pt-6 px-4 italic uppercase text-white">
                        <h1 className="text-3xl font-black text-slate-100 tracking-tighter italic">Drive<span className="text-blue-500">Pro</span></h1>
                        <div onClick={() => { setSelectedStudent(null); setView('ledger-view'); }} className="text-[10px] font-black text-slate-500 bg-slate-900 px-4 py-2 rounded-full border border-slate-800 shadow-lg">יתרה: <span className="text-emerald-500 underline font-black font-bold">₪{students.reduce((a,b)=>a+(b.balance||0),0)}</span></div>
                    </header>

                    <h2 className="text-xl font-black text-slate-100 mb-4 px-2 italic text-right font-bold tracking-tighter uppercase">יומן עבודה</h2>
                    <div className="bg-slate-900 p-5 rounded-[2.5rem] mb-8 border border-slate-800 shadow-2xl">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))} className="text-white">◀</button>
                            <h3 className="font-black italic text-xs uppercase text-white font-bold">{new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' }).format(currentMonth)}</h3>
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))} className="text-white">▶</button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-600 mb-2 italic"><div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div></div>
                        <div className="grid grid-cols-7 gap-1 mb-6">
                            {(() => {
                                const days = [];
                                const first = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
                                const count = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
                                const todayStr = new Date().toISOString().split('T')[0];
                                for (let i = 0; i < first; i++) days.push(<div key={`e-${i}`} className="h-10"></div>);
                                for (let d = 1; d <= count; d++) {
                                    const ds = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                    const has = allTransactions.some(t => t.type === 'lesson' && t.date?.startsWith(ds));
                                    const isToday = ds === todayStr;
                                    days.push(<div key={d} onClick={() => setSelectedDate(ds)} className={`h-10 flex flex-col items-center justify-center rounded-xl text-xs cursor-pointer active:scale-90 ${isToday ? 'ring-2 ring-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.5)]' : ''} ${selectedDate === ds ? 'bg-blue-600 text-white font-black' : 'text-slate-300'}`}>{d}{has && <div className="calendar-dot"></div>}</div>);
                                }
                                return days;
                            })()}
                        </div>
                        <div className="space-y-2 border-t border-slate-800 pt-4 text-right">
                            {allTransactions.filter(t => t.type === 'lesson' && t.date?.startsWith(selectedDate)).map(l => (
                                <div key={l.id} className="text-xs flex justify-between bg-slate-800/50 p-3 rounded-2xl border border-slate-700/30">
                                    <span className="font-bold text-white">{l.studentName}</span>
                                    <span className="font-black text-blue-400">{new Date(l.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 px-2 text-center">
                        <button onClick={() => { setIsEditing(false); setNewStudent({name:'', idNum:'', dob:'', address:'', phone:'', school:'', greenForm:'לא', theory:'לא'}); setView('add-student'); }} className="bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex flex-col items-center gap-2 active:scale-95 uppercase"><span className="text-2xl text-blue-500">+</span> <span className="text-[10px]">הוספת תלמיד</span></button>
                        <button onClick={() => { setSearchTerm(''); setView('student-list'); }} className="bg-slate-900 text-white p-6 rounded-[2rem] border border-slate-800 font-black shadow-xl flex flex-col items-center gap-2 active:scale-95 uppercase"><span className="text-2xl text-indigo-500">👥</span> <span className="text-[10px]">רשימת תלמידים</span></button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
