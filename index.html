<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro Elite v4.0</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc, getDoc };
    </script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SECRET_PIN = "1234";

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); 
            const [students, setStudents] = useState([]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (isAuthenticated) loadStudents();
            }, [isAuthenticated]);

            const loadStudents = async () => {
                const q = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snap = await window.fs.getDocs(q);
                setStudents(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const loadStudentData = async (student) => {
                setLoading(true);
                const q = window.fs.query(window.fs.collection(window.db, "transactions"), 
                    window.fs.where("studentId", "==", student.id), window.fs.orderBy("date", "desc"));
                const snap = await window.fs.getDocs(q);
                setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                setSelectedStudent(student);
                setView('details');
                setLoading(false);
            };

            const handleAddStudent = async () => {
                const name = prompt("שם מלא:");
                const phone = prompt("טלפון:");
                const idNum = prompt("מספר ת\"ז:");
                const address = prompt("כתובת:");
                if(!name) return;
                await window.fs.addDoc(window.fs.collection(window.db, "students"), {
                    name, phone, idNum, address, balance: 0, actualLessons: 0, 
                    internalTest: 'טרם', externalTest: 'טרם'
                });
                loadStudents();
            };

            const handleAddLesson = async () => {
                const dateStr = prompt("תאריך ושעה (פורמט: YYYY-MM-DDTHH:MM)", new Date().toISOString().slice(0,16));
                const duration = prompt("משך המפגש בדקות? (60 דקות = 1.5 שיעורים)", "60");
                const price = prompt("מחיר המפגש?", "200");
                if(!dateStr || !price) return;

                const lessonsCount = (Number(duration) / 60) * 1.5;
                const isFuture = new Date(dateStr) > new Date();

                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id,
                    type: 'lesson',
                    date: dateStr,
                    amount: Number(price),
                    lessonsCount: lessonsCount,
                    status: isFuture ? 'upcoming' : 'completed'
                });

                if(!isFuture) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)),
                        actualLessons: window.fs.increment(lessonsCount)
                    });
                }
                loadStudentData(selectedStudent);
            };

            const handleAddPayment = async () => {
                const amount = prompt("סכום תשלום:");
                if(!amount) return;
                const method = prompt("אמצעי תשלום (1-מזומן, 2-ביט, 3-העברה, 4-צ'ק, 5-אשראי):", "2");
                const methods = { "1": "מזומן", "2": "ביט", "3": "העברה", "4": "צ'ק", "5": "אשראי" };
                
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id,
                    type: 'payment',
                    date: new Date().toISOString(),
                    amount: Number(amount),
                    method: methods[method] || "ביט"
                });

                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                    balance: window.fs.increment(-Number(amount))
                });
                loadStudentData(selectedStudent);
            };

            const updateTestStatus = async (type, status) => {
                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), { [type]: status });
                setSelectedStudent({...selectedStudent, [type]: status});
            };

            // --- תיקון דף הכניסה ---
            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-[#0f172a] p-6 text-center">
                    <div className="mb-8">
                        <h1 className="text-5xl font-black text-indigo-500 italic tracking-tighter">DRIVE PRO</h1>
                        <p className="text-slate-500 text-sm mt-2 uppercase tracking-widest font-bold">Secure Access Only</p>
                    </div>
                    <div className="w-full max-w-xs bg-slate-800 p-8 rounded-[2.5rem] shadow-2xl border border-slate-700">
                        <label className="block text-slate-400 text-sm mb-4 font-bold">הקש קוד גישה</label>
                        <input 
                            type="password" 
                            inputMode="numeric"
                            placeholder="****" 
                            className="bg-slate-900 border-2 border-indigo-500/30 focus:border-indigo-500 text-white text-center text-4xl p-4 rounded-2xl w-full outline-none transition-all"
                            onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} 
                        />
                    </div>
                    <p className="mt-12 text-slate-600 text-xs italic">Version 4.0 Elite System</p>
                </div>
            );

            if (view === 'details' && selectedStudent) return (
                <div className="p-4 max-w-2xl mx-auto pb-24">
                    <button onClick={() => {setView('main'); loadStudents();}} className="mb-6 text-indigo-400 font-bold flex items-center gap-2">← חזרה</button>
                    
                    <div className="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 mb-6">
                        <div className="flex justify-between items-start mb-4 text-right">
                            <h2 className="text-3xl font-black">{selectedStudent.name}</h2>
                            <div className="text-2xl font-black text-rose-500">₪{selectedStudent.balance}</div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 text-sm text-slate-400 text-right">
                            <div dir="ltr">📞 {selectedStudent.phone}</div>
                            <div>🆔 {selectedStudent.idNum}</div>
                            <div>🏠 {selectedStudent.address}</div>
                            <div className="text-indigo-400 font-bold text-lg">🏁 שיעורים: {selectedStudent.actualLessons?.toFixed(1)}</div>
                        </div>
                        
                        <div className="flex gap-2 mt-8">
                            <button onClick={handleAddLesson} className="flex-1 bg-indigo-600 p-4 rounded-2xl font-bold shadow-lg shadow-indigo-500/20 active:scale-95 transition-transform">+ קביעת שיעור</button>
                            <button onClick={handleAddPayment} className="flex-1 bg-emerald-600 p-4 rounded-2xl font-bold shadow-lg shadow-emerald-500/20 active:scale-95 transition-transform">₪ הזנת תשלום</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 mb-8">
                        <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                            <div className="text-xs mb-2 text-slate-400 uppercase font-bold">טסט פנימי</div>
                            <select className="bg-slate-700 rounded-xl p-2 w-full text-white outline-none" value={selectedStudent.internalTest} onChange={(e)=>updateTestStatus('internalTest', e.target.value)}>
                                <option>טרם</option><option>עבר</option><option>נכשל</option>
                            </select>
                        </div>
                        <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-center">
                            <div className="text-xs mb-2 text-slate-400 uppercase font-bold">טסט חיצוני</div>
                            <select className="bg-slate-700 rounded-xl p-2 w-full text-white outline-none" value={selectedStudent.externalTest} onChange={(e)=>updateTestStatus('externalTest', e.target.value)}>
                                <option>טרם</option><option>עבר</option><option>נכשל</option>
                            </select>
                        </div>
                    </div>

                    <h3 className="font-bold mb-4 text-slate-400 uppercase tracking-widest text-sm px-2">היסטוריית פעולות</h3>
                    <div className="space-y-3 px-1">
                        {transactions.map(t => (
                            <div key={t.id} className="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50 flex justify-between items-center">
                                <div className="text-right">
                                    <div className="font-bold text-slate-200">{t.type === 'lesson' ? '📖 שיעור נהיגה' : `💰 תשלום (${t.method})`}</div>
                                    <div className="text-[10px] text-slate-500 mt-1">{new Date(t.date).toLocaleString('he-IL')}</div>
                                </div>
                                <div className="text-left">
                                    <div className={`text-lg font-black ${t.type === 'lesson' ? 'text-rose-400' : 'text-emerald-400'}`}>
                                        {t.type === 'lesson' ? `+₪${t.amount}` : `-₪${t.amount}`}
                                    </div>
                                    {t.status === 'upcoming' && <div className="text-[9px] bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full mt-1 font-bold text-center">מתוזמן</div>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="p-4 max-w-2xl mx-auto min-h-screen">
                    <div className="flex justify-between items-center mb-10 pt-6 px-2">
                        <div>
                            <h1 className="text-3xl font-black italic tracking-tighter text-slate-100">DRIVE<span className="text-indigo-500">PRO</span></h1>
                            <p className="text-[10px] font-bold text-slate-500 tracking-[0.3em] uppercase">Control Panel</p>
                        </div>
                        <button onClick={handleAddStudent} className="bg-indigo-600 w-14 h-14 rounded-2xl text-3xl font-light shadow-xl shadow-indigo-500/20 active:scale-90 transition-transform flex items-center justify-center">+</button>
                    </div>

                    <div className="grid gap-4 mb-32">
                        {students.map(s => (
                            <div key={s.id} onClick={() => loadStudentData(s)} 
                                className="bg-slate-800 p-6 rounded-[2.5rem] border border-slate-700/50 flex justify-between items-center active:scale-[0.98] transition-all shadow-xl">
                                <div className="text-right">
                                    <div className="text-xl font-black text-slate-100">{s.name}</div>
                                    <div className="text-xs text-slate-500 mt-1 font-medium italic">שיעורים: {s.actualLessons?.toFixed(1) || 0}</div>
                                </div>
                                <div className={`text-2xl font-black ${s.balance > 0 ? 'text-rose-500' : 'text-emerald-500'}`}>₪{s.balance}</div>
                            </div>
                        ))}
                    </div>

                    <div className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-indigo-600 px-10 py-4 rounded-[2rem] font-black shadow-[0_20px_50px_rgba(79,70,229,0.3)] whitespace-nowrap z-50 border border-indigo-400/30">
                        <span className="opacity-70 text-xs ml-2 font-normal">חוב כולל:</span> ₪{students.reduce((a,b)=>a+(b.balance || 0), 0)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
