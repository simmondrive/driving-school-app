<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <!-- ספריות חיצוניות -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ה-CONFIG שלך כבר בפנים:
        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>
</head>
<body class="bg-slate-950 min-h-screen text-slate-200 overflow-x-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // הגדרת קוד הגישה (PIN)
        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [students, setStudents] = useState([]);
            const [schedule, setSchedule] = useState([]);
            const [view, setView] = useState('main'); // 'main', 'student-details', 'schedule'
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [loading, setLoading] = useState(true);

            // טפסים
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');

            useEffect(() => {
                if (window.db && isAuthenticated) {
                    loadData();
                }
            }, [isAuthenticated]);

            const loadData = async () => {
                setLoading(true);
                // טעינת תלמידים
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                // טעינת יומן שיעורים מכל התלמידים
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.where("type", "==", "lesson"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setSchedule(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
                
                setLoading(false);
            };

            const addStudent = async () => {
                if(!name) return alert("הזן שם תלמיד");
                await window.fs.addDoc(window.fs.collection(window.db, "students"), {
                    name, phone, balance: 0, lessons: 0
                });
                setName(''); setPhone(''); loadData();
            };

            const createLesson = async () => {
                const price = prompt("מחיר שיעור?", "200");
                const dateTime = prompt("הזן תאריך ושעה (לדוגמה 2024-05-10 14:00)", ""); 
                if(!price || !dateTime) return;

                const lessonDate = new Date(dateTime.replace(' ', 'T'));
                if(isNaN(lessonDate)) return alert("פורמט תאריך לא תקין. השתמש ב: YYYY-MM-DD HH:MM");

                const status = lessonDate > new Date() ? 'upcoming' : 'completed';

                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id,
                    studentName: selectedStudent.name,
                    type: 'lesson',
                    amount: Number(price),
                    date: lessonDate.toISOString(),
                    status: status,
                    cancelReason: ''
                });

                if(status === 'completed') {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)),
                        lessons: window.fs.increment(1)
                    });
                }
                loadData();
                setView('main');
            };

            const createPayment = async () => {
                const amount = prompt("סכום ששולם?");
                const method = prompt("אמצעי תשלום (מזומן/ביט/העברה/אשראי)?", "ביט");
                if(!amount) return;

                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id,
                    type: 'payment',
                    amount: Number(amount),
                    method: method,
                    date: new Date().toISOString()
                });

                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                    balance: window.fs.increment(-Number(amount))
                });
                loadData();
                setView('main');
            };

            const cancelLesson = async (lesson) => {
                const reason = prompt("סיבת הביטול?");
                if(reason === null) return;
                await window.fs.updateDoc(window.fs.doc(window.db, "transactions", lesson.id), {
                    status: 'cancelled',
                    cancelReason: reason
                });
                loadData();
            };

            if (!isAuthenticated) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-white p-6">
                        <div className="text-6xl mb-8">🚗</div>
                        <h1 className="text-2xl font-bold mb-4 italic tracking-widest uppercase text-blue-400">DrivePro Access</h1>
                        <input type="password" 
                               className="bg-slate-900 text-white text-center text-4xl tracking-[0.5em] p-5 rounded-3xl w-full max-w-xs border-2 border-blue-500/30 focus:border-blue-500 outline-none transition-all shadow-2xl shadow-blue-500/20"
                               placeholder="****"
                               maxLength="4"
                               autoFocus
                               onChange={(e) => {
                                   setPinInput(e.target.value);
                                   if(e.target.value === SECRET_PIN) setIsAuthenticated(true);
                               }} />
                        <p className="mt-8 text-slate-500 text-sm italic">מערכת ניהול מאובטחת</p>
                    </div>
                );
            }

            if (view === 'schedule') {
                return (
                    <div className="p-4 max-w-md mx-auto pb-24">
                        <button onClick={() => setView('main')} className="mb-6 font-bold text-blue-400 flex items-center gap-1"><span>←</span> חזרה לתלמידים</button>
                        <h2 className="text-3xl font-black mb-6 text-slate-100">🗓️ יומן שיעורים</h2>
                        <div className="space-y-4">
                            {schedule.map(l => (
                                <div key={l.id} className={`p-5 rounded-3xl bg-slate-900 shadow-sm border-r-8 ${l.status === 'upcoming' ? 'border-blue-500' : l.status === 'cancelled' ? 'border-red-400 opacity-60' : 'border-emerald-500'}`}>
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <div className="font-bold text-lg text-slate-100">{l.studentName}</div>
                                            <div className="text-sm font-medium text-slate-400">
                                                {new Date(l.date).toLocaleDateString('he-IL', {weekday: 'long', day: 'numeric', month: 'numeric'})}
                                                <span className="mx-1 text-slate-600">|</span>
                                                {new Date(l.date).toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit'})}
                                            </div>
                                            {l.cancelReason && <div className="mt-2 text-xs bg-red-900/20 text-red-400 p-2 rounded-lg italic">סיבת ביטול: {l.cancelReason}</div>}
                                        </div>
                                        <div className="flex flex-col gap-2">
                                            {l.status === 'upcoming' && (
                                                <button onClick={() => cancelLesson(l)} className="bg-red-900/30 text-red-400 text-[10px] font-bold py-1 px-3 rounded-full border border-red-900/50 uppercase tracking-tighter">ביטול</button>
                                            )}
                                            <div className={`text-xs font-bold px-2 py-1 rounded-full text-center ${l.status === 'upcoming' ? 'bg-blue-900/30 text-blue-400' : l.status === 'cancelled' ? 'bg-red-900/30 text-red-400' : 'bg-emerald-900/30 text-emerald-400'}`}>
                                                {l.status === 'upcoming' ? 'עתידי' : l.status === 'cancelled' ? 'בוטל' : 'בוצע'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {schedule.length === 0 && <div className="text-center text-slate-500 py-12 italic">אין שיעורים מתוזמנים</div>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 max-w-md mx-auto pb-28">
                    <header className="flex justify-between items-center mb-8 pt-4">
                        <div>
                            <h1 className="text-3xl font-black text-slate-100 tracking-tight italic">DRIVE<span className="text-blue-500">PRO</span></h1>
                            <p className="text-xs font-bold text-slate-500 tracking-widest uppercase">Instructor Panel</p>
                        </div>
                        <button onClick={() => setView('schedule')} className="bg-blue-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-900/20 active:scale-90 transition-transform">
                            <span className="text-2xl">🗓️</span>
                        </button>
                    </header>

                    {/* קופה מהירה */}
                    <div className="bg-slate-900 p-6 rounded-[2rem] shadow-sm border border-slate-800 mb-8 flex justify-between items-center">
                        <div>
                            <div className="text-xs font-bold text-slate-500 uppercase tracking-tighter">יתרה כוללת לקבלה</div>
                            <div className="text-3xl font-black text-slate-100">₪{students.reduce((a,b)=>a+(b.balance||0),0)}</div>
                        </div>
                        <div className="w-12 h-12 bg-emerald-900/20 rounded-full flex items-center justify-center text-emerald-500 font-bold text-xl italic">₪</div>
                    </div>

                    <div className="bg-slate-900 p-6 rounded-[2.5rem] shadow-md border border-slate-800 mb-10">
                        <h3 className="font-black text-lg mb-4 text-slate-100">תלמיד חדש</h3>
                        <div className="flex gap-2">
                            <input className="flex-1 p-4 bg-slate-800 text-white border-none rounded-2xl outline-none focus:ring-2 ring-blue-500 transition-all font-medium" 
                                   placeholder="שם מלא..." value={name} onChange={e=>setName(e.target.value)} />
                            <button className="bg-blue-600 text-white px-6 rounded-2xl font-bold shadow-lg shadow-blue-900/20" onClick={addStudent}>+</button>
                        </div>
                    </div>

                    <div className="space-y-5">
                        <div className="flex justify-between items-center px-2">
                            <h3 className="font-black text-slate-500 text-xs uppercase tracking-widest">תלמידים פעילים</h3>
                            <span className="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">{students.length}</span>
                        </div>
                        {students.map(s => (
                            <div key={s.id} className="bg-slate-900 p-6 rounded-[2rem] shadow-sm border border-slate-800 transition-all relative overflow-hidden group">
                                <div className="flex justify-between items-start relative z-10">
                                    <div>
                                        <h3 className="font-black text-xl text-slate-100 mb-1">{s.name}</h3>
                                        <p className="text-slate-500 text-xs font-bold">{s.phone || 'ללא טלפון'}</p>
                                    </div>
                                    <div className={`text-2xl font-black italic ${s.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                        ₪{s.balance || 0}
                                    </div>
                                </div>
                                <div className="mt-6 flex gap-2 relative z-10">
                                    <button onClick={()=>{setSelectedStudent(s); createLesson();}} className="flex-1 bg-slate-800 text-white py-3 border border-slate-700 rounded-2xl text-[11px] font-bold uppercase tracking-tight active:scale-95 transition-all">קביעת שיעור</button>
                                    <button onClick={()=>{setSelectedStudent(s); createPayment();}} className="flex-1 bg-emerald-600 text-white py-3 rounded-2xl text-[11px] font-bold uppercase tracking-tight active:scale-95 transition-all shadow-lg shadow-emerald-900/20">הזנת תשלום</button>
                                </div>
                                <div className="absolute right-0 bottom-0 w-24 h-24 bg-slate-800 rounded-full translate-x-10 translate-y-10 group-hover:scale-150 transition-transform duration-700 opacity-30"></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
