<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>
    <style>
        input[type="date"], input[type="datetime-local"] { color-scheme: dark; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-200 overflow-x-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); // main, add-student, student-details
            const [students, setStudents] = useState([]);
            const [allTransactions, setAllTransactions] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            
            // טופס תלמיד חדש
            const [newStudent, setNewStudent] = useState({ name: '', idNum: '', dob: '', address: '', phone: '' });

            useEffect(() => {
                if (window.db && isAuthenticated) {
                    loadData();
                }
            }, [isAuthenticated]);

            const loadData = async () => {
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const handleAddStudent = async () => {
                if(!newStudent.name) return alert("שם הוא שדה חובה");
                await window.fs.addDoc(window.fs.collection(window.db, "students"), {
                    ...newStudent, balance: 0, lessons: 0
                });
                setNewStudent({ name: '', idNum: '', dob: '', address: '', phone: '' });
                setView('main');
                loadData();
            };

            const handleAddLesson = async (studentId, studentName) => {
                const amount = prompt("מחיר שיעור?", "200");
                const dateTime = prompt("בחר תאריך ושעה (לדוגמה: 2024-05-10 14:00)", ""); 
                if(!amount || !dateTime) return;
                
                const isoDate = new Date(dateTime.replace(' ', 'T')).toISOString();
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId, studentName, type: 'lesson', amount: Number(amount), date: isoDate, status: new Date(isoDate) > new Date() ? 'upcoming' : 'completed'
                });
                if(new Date(isoDate) <= new Date()) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", studentId), {
                        balance: window.fs.increment(Number(amount)),
                        lessons: window.fs.increment(1)
                    });
                }
                loadData();
            };

            const handleAddPayment = async (studentId) => {
                const amount = prompt("סכום תשלום?");
                if(!amount) return;
                const method = prompt("סוג תשלום: 1-מזומן, 2-אשראי, 3-ביט, 4-העברה, 5-שיק", "3");
                const methods = {"1":"מזומן", "2":"אשראי", "3":"ביט", "4":"העברה", "5":"שיק"};
                
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId, type: 'payment', amount: Number(amount), date: new Date().toISOString(), method: methods[method] || "מזומן"
                });
                await window.fs.updateDoc(window.fs.doc(window.db, "students", studentId), {
                    balance: window.fs.increment(-Number(amount))
                });
                loadData();
            };

            // רכיב יומן פשוט
            const CalendarHeader = () => {
                const lessonsToday = allTransactions.filter(t => t.type === 'lesson' && t.date.split('T')[0] === selectedDate);
                return (
                    <div className="bg-slate-900 p-4 rounded-3xl mb-6 border border-slate-800">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold">לו"ז שיעורים</h3>
                            <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="bg-slate-800 p-1 rounded text-sm outline-none border border-slate-700" />
                        </div>
                        <div className="space-y-2 max-h-40 overflow-y-auto">
                            {lessonsToday.length > 0 ? lessonsToday.map(l => (
                                <div key={l.id} className="text-xs flex justify-between bg-slate-800 p-2 rounded-xl">
                                    <span>{l.studentName}</span>
                                    <span className="text-blue-400 font-bold">{new Date(l.date).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                                </div>
                            )) : <p className="text-center text-slate-500 text-xs py-2">אין שיעורים ליום זה</p>}
                        </div>
                    </div>
                );
            };

            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-white p-6 text-center">
                    <h1 className="text-4xl font-black mb-8 text-indigo-500 italic">DRIVE PRO</h1>
                    <input type="password" placeholder="קוד גישה" className="bg-slate-900 border-2 border-indigo-500 text-white text-center text-4xl p-4 rounded-3xl w-full max-w-xs outline-none"
                           onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            if (view === 'add-student') return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← ביטול</button>
                    <h2 className="text-2xl font-black mb-6 text-slate-100 font-bold">הוספת תלמיד חדש</h2>
                    <div className="space-y-4">
                        <input className="w-full p-4 bg-slate-900 rounded-2xl outline-none" placeholder="שם מלא *" value={newStudent.name} onChange={e=>setNewStudent({...newStudent, name: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 rounded-2xl outline-none" placeholder="תעודת זהות" value={newStudent.idNum} onChange={e=>setNewStudent({...newStudent, idNum: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 rounded-2xl outline-none" type="date" placeholder="תאריך לידה" value={newStudent.dob} onChange={e=>setNewStudent({...newStudent, dob: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 rounded-2xl outline-none" placeholder="כתובת" value={newStudent.address} onChange={e=>setNewStudent({...newStudent, address: e.target.value})} />
                        <input className="w-full p-4 bg-slate-900 rounded-2xl outline-none" placeholder="טלפון" type="tel" value={newStudent.phone} onChange={e=>setNewStudent({...newStudent, phone: e.target.value})} />
                        <button className="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold mt-4" onClick={handleAddStudent}>אישור ושמירה</button>
                    </div>
                </div>
            );

            if (view === 'student-details' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <div className="bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800 shadow-xl mb-6">
                        <h2 className="text-3xl font-black text-white mb-4">{selectedStudent.name}</h2>
                        <div className="space-y-2 text-slate-400 text-sm mb-6">
                            <p>🆔 ת"ז: {selectedStudent.idNum || '---'}</p>
                            <p>📅 לידה: {selectedStudent.dob || '---'}</p>
                            <p>🏠 כתובת: {selectedStudent.address || '---'}</p>
                            <p>📞 טלפון: {selectedStudent.phone || '---'}</p>
                        </div>
                        <div className="flex justify-between border-t border-slate-800 pt-4">
                            <div className="text-center flex-1">
                                <p className="text-[10px] text-slate-500 uppercase">חוב</p>
                                <p className={`text-xl font-bold ${selectedStudent.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>₪{selectedStudent.balance}</p>
                            </div>
                            <div className="text-center flex-1">
                                <p className="text-[10px] text-slate-500 uppercase">שיעורים</p>
                                <p className="text-xl font-bold text-slate-100">{selectedStudent.lessons}</p>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={() => handleAddLesson(selectedStudent.id, selectedStudent.name)} className="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-bold">+ שיעור</button>
                        <button onClick={() => handleAddPayment(selectedStudent.id)} className="flex-1 bg-emerald-600 text-white py-3 rounded-2xl font-bold">₪ תשלום</button>
                    </div>
                </div>
            );

            return (
                <div className="p-4 max-w-md mx-auto pb-28">
                    <header className="flex justify-between items-center mb-6 pt-4 px-2">
                        <h1 className="text-2xl font-black text-slate-100 tracking-tight italic">DRIVE<span className="text-blue-500">PRO</span></h1>
                        <div className="text-xs font-bold text-slate-500 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                             חוב כולל: ₪{students.reduce((a,b)=>a+(b.balance||0),0)}
                        </div>
                    </header>

                    <CalendarHeader />

                    <div className="flex gap-4 mb-8">
                        <button onClick={() => setView('add-student')} className="flex-1 bg-slate-900 text-white p-4 rounded-[1.8rem] border border-slate-800 font-bold shadow-lg flex items-center justify-center gap-2 transition-active active:scale-95">
                            <span className="text-xl text-blue-500">+</span> הוספת תלמיד
                        </button>
                    </div>

                    <div className="space-y-4">
                        <h3 className="font-bold text-slate-500 text-xs uppercase px-2">רשימת תלמידים</h3>
                        {students.map(s => (
                            <div key={s.id} onClick={() => {setSelectedStudent(s); setView('student-details');}} className="bg-slate-900 p-5 rounded-[2rem] border border-slate-800 flex justify-between items-center transition-all active:scale-95">
                                <div>
                                    <div className="font-bold text-slate-100">{s.name}</div>
                                    <div className="text-[10px] text-slate-500">{s.phone}</div>
                                </div>
                                <div className={`font-black italic ${s.balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>₪{s.balance}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
