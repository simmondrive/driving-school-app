<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrivePro - ניהול מורה נהיגה</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVTYYZJdA8sysWRjdK9mRIsndqo-p31s4",
            authDomain: "drivingapp-d231f.firebaseapp.com",
            projectId: "drivingapp-d231f",
            storageBucket: "drivingapp-d231f.firebasestorage.app",
            messagingSenderId: "235953243839",
            appId: "1:235953243839:web:3facef57e16212f0fae80a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.fs = { collection, addDoc, getDocs, query, orderBy, where, doc, updateDoc, increment, deleteDoc };
    </script>
    <style>
        input[type="datetime-local"] { color-scheme: dark; background: #1e293b; color: white; }
        .calendar-dot { width: 4px; height: 4px; background-color: #60a5fa; border-radius: 50%; margin: 0 auto; margin-top: 2px; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen text-slate-200 overflow-x-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const SECRET_PIN = "1234"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [view, setView] = useState('main'); // main, add-student, student-details, add-lesson, student-list, ledger, ledger-options, select-ledger-student, student-history
            const [students, setStudents] = useState([]);
            const [allTransactions, setAllTransactions] = useState([]);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            
            const [newStudent, setNewStudent] = useState({ name: '', idNum: '', dob: '', address: '', phone: '' });
            const [lessonForm, setLessonForm] = useState({ dateTime: '', price: '200' });

            useEffect(() => {
                if (window.db && isAuthenticated) loadData();
            }, [isAuthenticated]);

            const loadData = async () => {
                const qS = window.fs.query(window.fs.collection(window.db, "students"), window.fs.orderBy("name"));
                const snapS = await window.fs.getDocs(qS);
                setStudents(snapS.docs.map(d => ({ id: d.id, ...d.data() })));
                
                const qL = window.fs.query(window.fs.collection(window.db, "transactions"), window.fs.orderBy("date", "desc"));
                const snapL = await window.fs.getDocs(qL);
                setAllTransactions(snapL.docs.map(d => ({ id: d.id, ...d.data() })));
            };

            const handleUpdateLesson = async (lesson) => {
                const action = prompt("בחר פעולה: 1-עריכת שעה/תאריך, 2-ביטול שיעור", "1");
                if (action === "1") {
                    const newDateTime = prompt("הזן תאריך ושעה חדשים (YYYY-MM-DDTHH:MM)", lesson.date.slice(0,16));
                    if (newDateTime) {
                        await window.fs.updateDoc(window.fs.doc(window.db, "transactions", lesson.id), { 
                            date: new Date(newDateTime).toISOString(),
                            status: new Date(newDateTime) > new Date() ? 'upcoming' : 'completed'
                        });
                        loadData();
                    }
                } else if (action === "2") {
                    const reason = prompt("סיבת הביטול?");
                    if (reason !== null) {
                        await window.fs.updateDoc(window.fs.doc(window.db, "transactions", lesson.id), { 
                            status: 'cancelled',
                            cancelReason: reason
                        });
                        loadData();
                    }
                }
            };

            const exportLedgerPDF = (isDownload = true) => {
                const doc = new jspdf.jsPDF();
                const filtered = allTransactions.filter(t => t.studentId === selectedStudent.id);
                doc.text(`Ledger: ${selectedStudent.name}`, 10, 10);
                const rows = filtered.map(t => [new Date(t.date).toLocaleDateString('he-IL'), t.type, t.amount]);
                doc.autoTable({ head: [['Date', 'Type', 'Amount']], body: rows, startY: 20 });
                if (isDownload) doc.save(`${selectedStudent.name}.pdf`);
            };

            const sendLedgerWA = () => {
                const phone = selectedStudent.phone ? selectedStudent.phone.replace(/\D/g, '') : '';
                const msg = `שלום ${selectedStudent.name}, יתרה נוכחית: ₪${selectedStudent.balance}`;
                window.open(`https://wa.me/${phone.startsWith('0') ? '972' + phone.substring(1) : phone}?text=${msg}`, '_blank');
            };

            const handleDeleteStudent = async (id) => {
                if(!confirm("מחיקת תלמיד?")) return;
                await window.fs.deleteDoc(window.fs.doc(window.db, "students", id));
                setView('main'); loadData();
            };

            const updateStudentField = async (field, label) => {
                const val = prompt(`עדכן ${label}:`, selectedStudent[field] || "");
                if (val === null) return;
                await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), { [field]: val });
                setSelectedStudent({...selectedStudent, [field]: val}); loadData();
            };

            const handleAddStudent = async () => {
                if(!newStudent.name) return alert("שם חובה");
                await window.fs.addDoc(window.fs.collection(window.db, "students"), { ...newStudent, balance: 0, lessons: 0 });
                setNewStudent({ name: '', idNum: '', dob: '', address: '', phone: '' });
                setView('main'); loadData();
            };

            const handleConfirmLesson = async () => {
                const { dateTime, price } = lessonForm;
                const isoDate = new Date(dateTime).toISOString();
                const isUpcoming = new Date(dateTime) > new Date();
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId: selectedStudent.id, studentName: selectedStudent.name, type: 'lesson', amount: Number(price), date: isoDate, status: isUpcoming ? 'upcoming' : 'completed'
                });
                if(!isUpcoming) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "students", selectedStudent.id), {
                        balance: window.fs.increment(Number(price)), lessons: window.fs.increment(1)
                    });
                }
                setView('main'); loadData();
            };

            const handleAddPayment = async (studentId) => {
                const amount = prompt("סכום תשלום?");
                const method = prompt("1-מזומן, 2-אשראי, 3-ביט, 4-העברה, 5-שיק", "3");
                const methods = {"1":"מזומן", "2":"אשראי", "3":"ביט", "4":"העברה", "5":"שיק"};
                if(!amount) return;
                await window.fs.addDoc(window.fs.collection(window.db, "transactions"), {
                    studentId, type: 'payment', amount: Number(amount), date: new Date().toISOString(), method: methods[method] || "מזומן"
                });
                await window.fs.updateDoc(window.fs.doc(window.db, "students", studentId), { balance: window.fs.increment(-Number(amount)) });
                loadData();
            };

            if (!isAuthenticated) return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-950 text-white p-6 text-center">
                    <h1 className="text-4xl font-black mb-8 text-indigo-500 italic uppercase">Drive Pro</h1>
                    <input type="password" placeholder="קוד" className="bg-slate-900 border-2 border-indigo-500 text-white text-center text-4xl p-4 rounded-3xl w-full max-w-xs outline-none"
                           onChange={(e) => e.target.value === SECRET_PIN && setIsAuthenticated(true)} />
                </div>
            );

            // --- רכיב היסטוריית שיעורים בתלמיד ---
            if (view === 'student-history' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('student-details')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <h2 className="text-2xl font-black mb-6 italic">יומן שיעורים: {selectedStudent.name}</h2>
                    <div className="space-y-3">
                        {allTransactions.filter(t => t.studentId === selectedStudent.id && t.type === 'lesson').map(l => (
                            <div key={l.id} onClick={() => handleUpdateLesson(l)} className={`bg-slate-900 p-4 rounded-2xl border-r-8 flex justify-between items-center transition-all active:scale-95 ${l.status === 'completed' ? 'border-emerald-500' : l.status === 'cancelled' ? 'border-red-500 opacity-60' : 'border-slate-500'}`}>
                                <div className="text-right">
                                    <div className={`font-bold ${l.status === 'completed' ? 'text-emerald-400' : l.status === 'cancelled' ? 'text-red-400' : 'text-slate-400'}`}>שיעור נהיגה</div>
                                    <div className="text-[10px] text-slate-500">{new Date(l.date).toLocaleString('he-IL')}</div>
                                    {l.cancelReason && <div className="text-[9px] text-red-500 italic">בוטל: {l.cancelReason}</div>}
                                </div>
                                <div className="text-left font-black">₪{l.amount}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (view === 'ledger-options' && selectedStudent) return (
                <div className="p-6 max-w-md mx-auto flex flex-col justify-center min-h-screen text-center">
                    <button onClick={() => setView('select-ledger-student')} className="mb-10 text-blue-400 font-bold self-start">← חזרה</button>
                    <h2 className="text-3xl font-black mb-10">{selectedStudent.name}</h2>
                    <div className="space-y-4">
                        <button onClick={sendLedgerWA} className="w-full bg-emerald-600 text-white p-5 rounded-3xl font-black">שלח כרטסת (WhatsApp)</button>
                        <button onClick={() => exportLedgerPDF(true)} className="w-full bg-blue-600 text-white p-5 rounded-3xl font-black">הורד כרטסת (PDF)</button>
                        <button onClick={() => setView('ledger')} className="w-full bg-slate-800 text-white p-5 rounded-3xl font-black border border-slate-700">הצג כרטסת</button>
                    </div>
                </div>
            );

            if (view === 'select-ledger-student' || view === 'student-list') return (
                <div className="p-6 max-w-md mx-auto">
                    <button onClick={() => setView('main')} className="mb-6 text-blue-400 font-bold">← חזרה</button>
                    <input autoFocus className="w-full p-4 bg-slate-900 border border-slate-800 rounded-2xl outline-none mb-6" placeholder="🔍 חפש תלמיד..." onChange={e => setSearchTerm(e.target.value)} />
                    <div className="space-y-3">
                        {students.filter(s => s.name.includes(searchTerm)).map(s => (
                            <div key={s.id} onClick={() =>
